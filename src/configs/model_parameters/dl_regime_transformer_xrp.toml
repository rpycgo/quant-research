# configs/model_parameters/dl_regime_transformer_xrp.toml
#
# Local override for the DL regime TRANSFORMER model on XRPUSDT futures.
# Keys absent here fall back to dl_regime/configs/default_config.toml.

[model]
architecture   = "transformer"
checkpoint_dir = "checkpoints/xrp"

[training]
seq_len = 288    # 24h look-back at 5m interval
