[project]
name = "quant-research"
version = "1.10.0"
description = "Quantitative research and backtesting platform"
authors = [{ name = "rpycgo", email = "skyd0608@gmail.com" }]
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = [
    "mdrs-sde",
    "dl-regime",
    "python-binance (>=1.0.34,<2.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "aiokafka (>=0.13.0,<0.14.0)",
    "aiohttp (>=3.13.3,<4.0.0)",
    "dvc>=3.67.0",
    "dvc-gdrive>=3.0.1",
    "ccxt>=4.5.45",
    "joblib>=1.5.3",
    "hmmlearn>=0.3.3",
    "arch>=8.0.0",
]

[project.scripts]
qr-backtest            = "backtesting.cli.backtest:main"
qr-buy-and-hold        = "backtesting.cli.buy_and_hold:main"
qr-data-collect        = "data.cli.data_collect:main"
qr-mdrs-event-detect   = "strategies.mdrs_sde.cli.event_detect:main"
qr-dl-train            = "strategies.dl_regime.cli.train:main"
qr-validate            = "backtesting.cli.validate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtesting", "src/data", "src/strategies", "src/collector", "src/ingestor", "src/utils"]

[tool.uv.sources]
mdrs-sde = { git = "https://github.com/rpycgo-research/mdrs-sde.git" }
dl-regime = { git = "https://github.com/rpycgo/dl-regime.git" }
