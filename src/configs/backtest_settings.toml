# configs/backtest_settings.toml
#
# Shared execution and risk settings used by ALL model + asset combinations.
#
# These values are model-agnostic.  Model-specific overrides (e.g. different
# TP ratios for a particular strategy) belong in the model's entry under
# configs/model_parameters/.

[filters]
only_selected_zone  = false

[filters.qpb]
# PAITS-Event pre-execution signal-gating mode. As of v2.0.1 only
# "event_rate" is supported. See [filters.qpb.event_rate] for parameters.
# Omit this section entirely to disable event-rate signal gating.
mode = "event_rate"

[filters.qpb.event_rate]
# PAITS-Event gate parameters. Replaces the legacy QPB envelope chain
# (sticky / ADX / breakout / QPB), which was removed in v2.0, with a
# single bar-level threshold on rolling_max(regime_prob,
# score_window_bars). The threshold is recomputed at each test-month
# start by bisection over the previous lookback window so that the
# cooldown-adjusted event count matches target_events_per_month. This
# eliminates the threshold-grid hyperparameter set entirely;
# cross-asset transfer needs no rescaling of absolute regime_prob
# values.
target_events_per_month = 5.0       # primary tuning hyperparameter
cooldown_days           = 5.0       # 1 trading week (natural time unit)
lookback_days           = 90        # 3 months (= Bayesian detector train window)
score_window_bars       = 144       # 12h rolling max (= 1 trading session)
refit_freq              = "ME"      # pandas offset alias (month-end)
fallback_threshold      = 0.45      # used before lookback fills
min_lookback_bars       = 100       # warmup gate

[execution_costs]
commission_rate = 0.0005   # 0.05 % per leg
slippage_rate   = 0.001    # 0.10 % per leg

[walk_forward_settings]
training_months = 3
testing_months  = 1
parallel_jobs   = 10
start_date      = "2020-04-01"
end_date        = "2025-12-31"

[trading_parameters]
tp_long                   = 0.06
sl_long                   = 0.03
tp_short                  = 0.06
sl_short                  = 0.03
trailing_stop_start_ratio = 0.00
max_hold_hours            = 720

[risk_management]
break_even_trigger_ratio_long  = 0.3
break_even_trigger_ratio_short = 0.3
entry_probability_threshold    = 0.5