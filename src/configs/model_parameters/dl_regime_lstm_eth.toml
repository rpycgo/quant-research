# configs/model_parameters/dl_regime_lstm_eth.toml
#
# Local override for the DL regime LSTM model on ETHUSDT futures.
# Keys absent here fall back to dl_regime/configs/default_config.toml.

[model]
architecture   = "lstm"
checkpoint_dir = "checkpoints"

[training]
seq_len = 288    # 24h look-back at 5m interval
