# configs/backtest_settings.toml
#
# Shared execution and risk settings used by ALL model + asset combinations.
#
# These values are model-agnostic.  Model-specific overrides (e.g. different
# TP ratios for a particular strategy) belong in the model's entry under
# configs/model_parameters/.

[filters]
use_sticky          = true
use_adx             = true
only_selected_zone  = false

[filters.qpb]
# Quiet Pre-Breakout gate. Three modes:
#   mode = "static"      — absolute thresholds below (v1.17 behaviour)
#   mode = "walkforward" — threshold estimated from recent trade history
#                          using [filters.qpb.walkforward] section
#   mode = "event_rate"  — PAITS-Event gate (v1.20+): bar-level threshold
#                          on rolling-max regime_prob, recomputed each
#                          month by bisection so that the cooldown-
#                          adjusted event rate matches a target rate.
#                          See [filters.qpb.event_rate] section.
mode                   = "walkforward"

# Static-mode thresholds (BTC-calibrated 2020-2025). Also used as
# fallback values in walkforward mode before the lookback window fills.
enabled                = true
past_vol_48b_max       = 0.003   # 4h log-return std cap
aligned_pret_48b_max   = 0.02    # direction-aligned 4h return cap
d_rv_90d_max           = 0.55    # 90d annualised realised vol cap

[filters.qpb.walkforward]
# Walk-forward threshold estimation parameters. Active only when
# [filters.qpb].mode = "walkforward". Thresholds are re-estimated from
# the trade history every `refit_freq_months` months by grid-searching
# the cartesian product of the three grids below and selecting the
# triple that maximises the chosen criterion on the lookback window.
lookback_months           = 3
refit_freq_months         = 3
min_lookback_trades       = 20
min_filter_trades         = 5
criterion                 = "sharpe_stable"    # sharpe | mean | sortino | sharpe_stable
trades_per_year_estimate  = 10.0

# Grid search space (three independent 1D grids; cartesian product used)
vol_grid  = [0.002, 0.0025, 0.003, 0.0035, 0.004, 0.005]
pret_grid = [0.015, 0.020, 0.025, 0.030, 0.040, 0.050]
rv_grid   = [0.45, 0.50, 0.55, 0.60, 0.70, 0.85]

[filters.qpb.event_rate]
# PAITS-Event gate parameters (v1.20+). Active only when
# [filters.qpb].mode = "event_rate". Replaces the QPB envelope chain
# (sticky/ADX/breakout/QPB) with a single bar-level threshold on
# rolling_max(regime_prob, score_window_bars). The threshold is
# recomputed at each test-month start by bisection over the previous
# lookback window so that the cooldown-adjusted event count matches
# target_events_per_month. This eliminates the threshold-grid
# hyperparameter set entirely; cross-asset transfer needs no
# rescaling of absolute regime_prob values.
target_events_per_month = 5.0       # primary tuning hyperparameter
cooldown_days           = 5.0       # 1 trading week (natural time unit)
lookback_days           = 90        # 3 months (= Bayesian detector train window)
score_window_bars       = 144       # 12h rolling max (= 1 trading session)
refit_freq              = "ME"      # pandas offset alias (month-end)
fallback_threshold      = 0.45      # used before lookback fills
min_lookback_bars       = 100       # warmup gate

[execution_costs]
commission_rate = 0.0005   # 0.05 % per leg
slippage_rate   = 0.001    # 0.10 % per leg

[walk_forward_settings]
training_months = 3
testing_months  = 1
parallel_jobs   = 10
start_date      = "2020-04-01"
end_date        = "2025-12-31"

[trading_parameters]
tp_long                   = 0.06
sl_long                   = 0.03
tp_short                  = 0.06
sl_short                  = 0.03
trailing_stop_start_ratio = 0.00
max_hold_hours            = 720
adx_threshold             = 30

[risk_management]
minimum_signal_duration        = 5
break_even_trigger_ratio_long  = 0.3
break_even_trigger_ratio_short = 0.3
entry_probability_threshold    = 0.5