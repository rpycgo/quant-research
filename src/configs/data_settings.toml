# configs/data_settings.toml
#
# Shared data-pipeline settings: collection, preprocessing windows, and
# event-detection thresholds.  These are asset-class agnostic; symbol-
# specific overrides live in configs/model_parameters/<model_key>.toml.

[binance_collection]
interval         = "5m"
output_directory = "data/crypto/binance/futures"

# Supported symbols — add new pairs here as loaders are implemented.
# The CryptoLoader validates incoming symbol requests against this list.
supported_symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT"]

[event_detection]
output_filename         = "data/events.toml"
analysis_start_date     = "2020-01-01"
analysis_end_date       = "2025-12-31"
global_window_size      = 288          # 24 h at 5 m intervals
noise_floor             = 0.001
clipping_upper_limit    = 6.0
hybrid_smoothing_window = 3
minimum_periods_standard = 20
hybrid_z_threshold      = 2.0
energy_rolling_window   = 20
sr_proximity_threshold  = 0.005
sr_lookback_window      = 288
quiet_regime_threshold  = 1.3
min_window_magnitude    = 0.03
persistence_duration    = 6
event_window_half_hours = 2
