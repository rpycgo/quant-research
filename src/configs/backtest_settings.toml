# configs/backtest_settings.toml
#
# Shared execution and risk settings used by ALL model + asset combinations.
#
# These values are model-agnostic.  Model-specific overrides (e.g. different
# TP ratios for a particular strategy) belong in the model's entry under
# configs/model_parameters/.

[filters]
use_sticky          = true
use_adx             = true
only_selected_zone  = false

[execution_costs]
commission_rate = 0.0005   # 0.05 % per leg
slippage_rate   = 0.001    # 0.10 % per leg

[walk_forward_settings]
training_months = 3
testing_months  = 1
parallel_jobs   = 10
start_date      = "2020-04-01"
end_date        = "2025-12-31"
ema_sigma_span  = 3

[trading_parameters]
tp_long                   = 0.06
sl_long                   = 0.03
tp_short                  = 0.05
sl_short                  = 0.025
trailing_stop_start_ratio = 0.02
max_hold_hours            = 720
adx_threshold             = 30

[risk_management]
minimum_signal_duration        = 5
break_even_trigger_ratio_long  = 0.7
break_even_trigger_ratio_short = 0.3
entry_probability_threshold    = 0.5